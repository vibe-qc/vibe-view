# Loaded only when the external deployment job is configured. Keep the
# deployment script/environment there; override only this product's rules.
# GitLab stops at the first matching rule, so web must precede release (#22).
docs-deploy:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "release"'
