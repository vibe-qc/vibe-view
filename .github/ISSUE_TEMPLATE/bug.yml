name: Bug report
description: Report a viewer, rendering, QVF loading or installation problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Report security problems privately using SECURITY.md.
        Before attaching files, remove credentials, private machine/account names, personal paths and sensitive scientific content. Review QVF metadata, logs and screenshots too.
  - type: input
    id: release
    attributes:
      label: Viewer release and commit
      description: Include the vibe-view version and commit ID if known.
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: Operating system and architecture
      placeholder: "For example: Ubuntu 24.04, x86-64"
    validations:
      required: true
  - type: dropdown
    id: install_route
    attributes:
      label: Installation route
      options:
        - Source install script
        - pip or wheel
        - Packaged desktop application
        - Container
        - Other (describe below)
    validations:
      required: true
  - type: input
    id: viewer_mode
    attributes:
      label: Viewer mode
      description: Browser (include browser version), desktop, terminal or headless export.
    validations:
      required: true
  - type: input
    id: qvf_producer
    attributes:
      label: QVF schema and producer
      description: Give the QVF schema version and producer/version, or describe the other input format. Write not applicable for an installation-only problem.
    validations:
      required: true
  - type: textarea
    id: minimal_input
    attributes:
      label: Minimal redacted input and reproduction steps
      description: Attach the smallest shareable QVF or other input and give the exact command and UI steps. Use synthetic data if the original cannot be shared. For installation problems, give the installation command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: For numerical differences, give the reference, units, settings and tolerance.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: Include the error or numerical difference and whether an earlier release worked.
    validations:
      required: true
  - type: textarea
    id: console_error
    attributes:
      label: Console error and relevant logs
      description: Include redacted browser developer-console or terminal output. If there is no console error, say so. Review paths, metadata and screenshots before attaching them.
    validations:
      required: true
