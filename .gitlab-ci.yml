# Site deployment is optional and configured outside the source repository.
# Authorized operators set all three include variables in project settings.
include:
  - project: '$VIBE_VIEW_CI_PROJECT'
    ref: '$VIBE_VIEW_CI_REF'
    file: '$VIBE_VIEW_CI_FILE'
    rules:
      - if: '$VIBE_VIEW_CI_PROJECT || $VIBE_VIEW_CI_REF || $VIBE_VIEW_CI_FILE'

# Portable build and validation rules.
stages:
  - test
  - build
  - deploy


variables:
  # The QVF specification this viewer is checked against. Bump deliberately.
  QVF_TAG: "v0.1.0"


# --------------------------------------------------------------------
# The rule matrix.
#
# `workflow:` below is the admission list -- which refs get a pipeline at
# all. It is not the gate. Which jobs that pipeline then runs is decided
# per job, by the `.rules_*` anchors under it and by `docs-build`'s own
# list, and nowhere else.
#
#   ref / source          test  qvf-conformance  docs-build   deploy
#   --------------------  ----  ---------------  ----------  --------
#   merge request          yes        yes         on change     no
#   release-candidate/*    yes        yes            yes        no
#   web (manual)           yes        yes            yes      manual
#   main                    no         no            yes        no
#   release                 no         no            yes       yes
#
# The deploy column is the external include's, listed so the table is the
# whole picture; this file does not define those jobs.
#
# `test` and `qvf-conformance` used to carry no rules of their own, so they
# fell through to the admission list and ran on every ref in it. On
# `release` that repeated, at an identical tree, the gate the candidate
# branch had just passed at the same SHA.
#
# Why the two `no` columns:
#
# * `main` is where work lands, not a gate. A commit on it was proved by
#   the merge request that landed it, and the branch is proved as a whole
#   by the `release-candidate/*` pipeline before a tag is spent -- the
#   delivery model in docs/roadmap.md and docs/release_process.md. Running
#   the suite here re-proves the merge request, and release preparation had
#   to push with `ci.skip` to get out of its way.
# * `release` only ever fast-forwards onto a commit whose candidate
#   pipeline is already green. `docs-build` stays, because the deployment
#   jobs in the external include publish the `public/` it produces.
#
#   One consequence to know about: `test` is also what builds the wheel and
#   sdist into `dist/`, so a `release` pipeline no longer carries them. The
#   candidate pipeline at the identical SHA does, and that is the build to
#   publish -- one canonical set of artifacts per release rather than two.
#
# Two deliberate exceptions:
#
# * `web` runs everything, on any admitted ref. It is the operator's way to
#   re-prove `main` or `release` on demand without inventing a branch.
# * merge requests build the docs only when the change touches something
#   the site renders; `docs-build`'s `changes:` list is that filter.
#
# tests/test_ci_rules.py evaluates this file against the table above, so a
# job that loses its rules cannot go back to inheriting the admission list.
# --------------------------------------------------------------------

workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "release"'
    - if: '$CI_COMMIT_BRANCH =~ /^release-candidate\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never


# The per-change product gate. `main` and `release` are absent on purpose;
# both jobs that use this must agree on the refs they gate, so they share
# one list rather than two that can drift apart.
.rules_product_gate:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^release-candidate\//'
    - if: '$CI_PIPELINE_SOURCE == "web"'


test:
  stage: test
  image: python:3.13-slim-bookworm
  tags:
    - docker
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
    PYVISTA_OFF_SCREEN: "True"
  cache:
    - key: pip-vibeview
      paths:
        - .cache/pip/
  before_script:
    # PyVista/VTK need a GL + X stack even for offscreen rendering; xvfb
    # provides a virtual display. xauth is required by xvfb-run itself.
    - apt-get -qq update && apt-get -qq install -y --no-install-recommends
      git libgl1 libglx-mesa0 libxrender1 libxext6 libsm6 libglib2.0-0
      xvfb xauth
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # A few tests read real archives from the QVF conformance corpus, which
    # lives in the qvf repository. It covers the 2-D slab paths against a
    # genuine producer artifact, and this lane requires it (see the script
    # step): a missing corpus fails here rather than skipping.
    - git clone --depth 1 --branch "$QVF_TAG"
      "${QVF_REPOSITORY_URL:-https://github.com/vibe-qc/qvf.git}"
      /tmp/qvf
    - pip install -e '.[test,release]'
  script:
    # VIBEVIEW_REQUIRE_QVF_CORPUS turns "corpus missing" from a skip into a
    # hard error. This lane clones qvf on purpose, so a corpus that is not
    # there is a broken lane -- without this, a rename in the clone step
    # above would retire that coverage silently in a green pipeline.
    - QVF_CORPUS=/tmp/qvf/conformance/corpus
      VIBEVIEW_REQUIRE_QVF_CORPUS=1
      xvfb-run -a python -m pytest tests -q -p no:cacheprovider
    - python scripts/build_release_artifacts.py --output-dir dist
    # A wheel built from a clean venv must import and run with no checkout
    # present -- this is what proves the schema files ship as real data
    # files rather than symlinks into a sibling directory.
    - SMOKE_ROOT="$(mktemp -d)";
      python -m venv "$SMOKE_ROOT/venv";
      WHEEL="$(find "$CI_PROJECT_DIR/dist" -type f
      -name 'vibeview-*-py3-none-any.whl' -print -quit)";
      test -n "$WHEEL";
      "$SMOKE_ROOT/venv/bin/pip" install --quiet
      "vibeview[viewer,tui,ase] @ file://$WHEEL";
      "$SMOKE_ROOT/venv/bin/pip" check;
      (cd /tmp && PYTHONNOUSERSITE=1 "$SMOKE_ROOT/venv/bin/python"
      "$CI_PROJECT_DIR/scripts/smoke_installed_wheel.py"
      --source-root "$CI_PROJECT_DIR/src")
  artifacts:
    name: vibeview-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}
    expire_in: 2 weeks
    paths:
      - dist/*.whl
      - dist/*.tar.gz
      - dist/SHA256SUMS
  rules:
    - !reference [.rules_product_gate, rules]

# The consumer half of the QVF contract.
#
# vibe-view carries its own copy of the manifest schema, and vibe-qc carries
# another. In the monorepo the viewer's copy was a symlink into the producer's
# tree, so they could not diverge; the guards that checked them skipped
# silently when a sibling was missing, which after the split would mean they
# never fail again. This job replaces that: the normative schema lives in the
# qvf repository, and this asserts the vendored copy still matches it, then
# proves the viewer can actually read every archive in the corpus.
#
# This is a BUILD-TIME check only. Nothing here is imported at runtime and
# nothing is added to [project.dependencies]: qvf is a reference, not a
# library vibe-view depends on. QVF_TAG is bumped by hand.

qvf-conformance:
  stage: test
  image: python:3.13-slim-bookworm
  tags:
    - docker
  before_script:
    - apt-get -qq update && apt-get -qq install -y --no-install-recommends git
    - git clone --depth 1 --branch "$QVF_TAG"
      "${QVF_REPOSITORY_URL:-https://github.com/vibe-qc/qvf.git}"
      /tmp/qvf
    - pip install -e '.[ase]' jsonschema
  script:
    - python scripts/check_qvf_conformance.py --qvf-root /tmp/qvf
  rules:
    - !reference [.rules_product_gate, rules]

# --------------------------------------------------------------------
# Shared docs environment + dependency install.
#
# `extends:` and `!reference` rather than YAML anchors: extends deep-merges
# `variables:`, so a job can add DEPLOY_* without dropping PIP_CACHE_DIR, and
# !reference flattens into a script list, which a bare alias to a sequence
# does not.
#
# The image installs Sphinx plus the four LIGHTWEIGHT runtime deps that
# vibeview's documented modules import at module scope -- numpy, click,
# pydantic, jsonschema. autosummary imports vibeview.{api,qvf,kinds,codenames}
# to scan docstrings, so those have to resolve. The heavy rendering stack
# (pyvista, vtk, trame, matplotlib, plotly) stays out and is mocked instead,
# via autodoc_mock_imports in docs/conf.py: none of it is needed to render
# prose and signatures, and installing VTK to build a docs page would cost
# minutes per job for nothing.
# --------------------------------------------------------------------

.docs_env:
  image: python:3.13-slim-bookworm
  tags:
    - docker
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  cache:
    - key: pip-vibeview-docs
      paths:
        - .cache/pip/


.docs_deps:
  before_script:
    # python:3.13-slim ships no git, and scripts/build_site.sh writes a
    # commit-stamp into public/.build-info.
    - apt-get -qq update && apt-get -qq install -y --no-install-recommends git
    # The checkout uid can differ from the job uid, which makes every git
    # invocation fail with 'detected dubious ownership'.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - python -V
    # The toolchain is declared in pyproject.toml's [docs] extra, not here:
    # pinning it inline left the requirement in no package metadata, so the
    # only way to render the site locally was to retype this list. The extra
    # installs the package too, which is where numpy/click/pydantic/jsonschema
    # come from -- they used to be repeated here and could keep an old floor
    # after [project.dependencies] moved.
    - pip install --quiet -e '.[docs]'

# --------------------------------------------------------------------
# docs-build -- render the Sphinx site into public/. Publishes nothing;
# this is the proof that the documentation tree still renders.
# --------------------------------------------------------------------

docs-build:
  stage: build
  extends: .docs_env
  before_script:
    - !reference [.docs_deps, before_script]
  script:
    - bash scripts/build_site.sh
    # The published build deliberately does not use -W: a warning must not
    # block a release. So assert the site actually rendered, rather than
    # trusting a zero exit from a build that emitted nothing.
    - test -f public/index.html
    - test -f public/sitemap.xml
    - test -f public/_static/custom.css
    - echo "rendered $(find public -name '*.html' | wc -l) HTML pages"
  artifacts:
    name: vibeview-docs-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}
    expire_in: 2 weeks
    paths:
      - public/
  # Not .rules_product_gate: this is the one job that also runs on `main`
  # (the downloadable site artifact) and on `release` (the deployment jobs
  # in the external include publish the `public/` built here), and the one
  # that narrows merge requests to changes the site actually renders.
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "release"'
    - if: '$CI_COMMIT_BRANCH =~ /^release-candidate\//'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ".gitlab-ci.yml"
        - "CHANGELOG.md"
        - "CONTRIBUTING.md"
        - "README.md"
        - "docs/**/*"
        - "scripts/build_site.sh"
        - "src/vibeview/codenames.py"

# Deployment jobs, when configured, come from the external include above.
